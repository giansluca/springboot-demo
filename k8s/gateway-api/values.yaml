logs:
  access:
    enabled: true
ports:
  web: 
    port: 80
  websecure:
    port: 443
    exposedPort: 443

# we enable gateway-api features
providers:
  kubernetesGateway:
    enabled: true
    experimentalChannel: false

# we disable gateway-api defaults because we want to provide our own
gatewayClass:
  enabled: true

# we disable gateway-api defaults because we want to provide our own
gateway:
  enabled: true
  listeners:
    web:
      port: 80
      protocol: HTTP
      name: web
#    websecure: --> need cert
#      port: 443
#      protocol: HTTPS
#      name: websecure