apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: black-bull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo-1
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "docker"
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "12345"
            - name: MONGO_INITDB_DATABASE
              value: "mongo-db-1"
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: black-bull
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017


