name: Build and Push Docker Image

env:
  APP_NAME: springboot-demo
  IMAGE_NAME: gianlucamori/springboot-demo
on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ env.APP_NAME }}
      image_name: ${{ env.IMAGE_NAME }}
      sha: ${{ steps.vars.outputs.sha }}
      tag: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  # --- JOB 1: DEVELOPMENT (Commits on Master) ---
  job_dev:
    if: github.ref_type == 'branch'
    needs: setup
    runs-on: ubuntu-latest
    environment: dev  # GitHub environment 'dev' must exist in repo settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Dev Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy_dev:
    needs: [setup, job_dev]
    uses: giansluca/multi-k8s/.github/workflows/reusable-update-manifest.yaml@master
    with:
      env: "dev"
      app_name: ${{ needs.setup.outputs.app_name }}
      image_name: ${{ needs.setup.outputs.image_name }}
      tag: ${{ needs.setup.outputs.sha }}
    secrets:
      token: ${{ secrets.MANIFEST_REPO_TOKEN }}

  # --- JOB 2: TESTING (Git Tags) ---
  job_test:
    if: github.ref_type == 'tag'
    needs: setup
    runs-on: ubuntu-latest
    environment: test  # GitHub environment 'test' must exist in repo settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy_test:
    needs: [ setup, job_test ]
    uses: giansluca/multi-k8s/.github/workflows/update-manifest-reusable.yaml@master
    with:
      env: "test"
      app_name: ${{ needs.setup.outputs.app_name }}
      image_name: ${{ needs.setup.outputs.image_name }}
      tag: ${{ needs.setup.outputs.tag }}
    secrets:
      token: ${{ secrets.MANIFEST_REPO_TOKEN }}