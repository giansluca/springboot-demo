name: Build and Push Docker Image

env:
  APP_NAME: springboot-demo
  IMAGE_NAME: gianlucamori/springboot-demo
on:
  push:
    # branches: [ "master" ]
    tags: [ 'v*' ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ env.APP_NAME }}
      image_name: ${{ env.IMAGE_NAME }}
      sha: ${{ steps.vars.outputs.sha }}
      clean_tag: ${{ steps.vars.outputs.clean_tag }}
      tag: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Short SHA
        id: vars
        run: |
          # Generate the short SHA
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          
          # Remove the initial 'v' from git tag (if present) to get a clean tag name
          # If github.ref_name is 'v0.0.4', CLEAN_TAG becomes '0.0.4'
          CLEAN_TAG=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "clean_tag=$CLEAN_TAG" >> $GITHUB_OUTPUT

  # --- JOB 1: DEVELOPMENT (Commits on Master) ---
  job_dev:
    if: |
      github.ref_type == 'branch' && 
      !contains(github.event.head_commit.message, '[maven-release-plugin] prepare release')
    needs: setup
    runs-on: ubuntu-latest
    environment: dev  # GitHub environment 'dev' must exist in repo settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          architecture: x64
          cache: maven
      - name: Build with Maven
        run: mvn clean test
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Dev Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.sha }}

  deploy_dev:
    needs: [setup, job_dev]
    uses: giansluca/multi-k8s/.github/workflows/argo-updater.yaml@master
    with:
      env: "dev"
      app_name: ${{ needs.setup.outputs.app_name }}
      image_name: ${{ needs.setup.outputs.image_name }}
      tag: ${{ needs.setup.outputs.sha }}
    secrets:
      token: ${{ secrets.MULTI_K8S_TOKEN }}

  # --- JOB 2: TESTING (Git Tags) ---
  job_test:
    if: github.ref_type == 'tag'
    needs: setup
    runs-on: ubuntu-latest
    environment: test  # GitHub environment 'test' must exist in repo settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.clean_tag }}

  deploy_test:
    needs: [ setup, job_test ]
    uses: giansluca/multi-k8s/.github/workflows/argo-updater.yaml@master
    with:
      env: "test"
      app_name: ${{ needs.setup.outputs.app_name }}
      image_name: ${{ needs.setup.outputs.image_name }}
      tag: ${{ needs.setup.outputs.clean_tag }}
    secrets:
      token: ${{ secrets.MULTI_K8S_TOKEN }}