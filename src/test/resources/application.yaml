server:
  port: 8080

spring:
  application:
    name: springboot-demo-test
  datasource:
    url: jdbc:tc:postgresql:${container.postgres.tag}:///spring_boot_testcontainers?TC_REUSABLE=false&TC_INITSCRIPT=setup-postgresql.sql
  test:
    database:
      replace: none
  jpa:
    show-sql: false
  springdoc:
    api-docs:
      enabled: true
    swagger-ui:
      enabled: true

container:
  postgres:
    image: postgres
    tag: 18.3
  mongo:
    image: mongo
    tag: 8.0
